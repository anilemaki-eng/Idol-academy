<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Idol Academy</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/schedule.css">
  <link rel="stylesheet" href="css/dance.css">
  <link rel="stylesheet" href="css/learn-choreo.css">
  <link rel="stylesheet" href="css/compare.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="app-name">Idol Academy</p>
    </div>
  </header>

  <main id="app" class="container"></main>

  <!-- Main menu, fixed to the bottom of the screen -->
  <nav class="bottom-nav" aria-label="Main">
    <div class="container">
      <ul id="main-nav" class="nav-list"></ul>
    </div>
  </nav>

  <!-- 1. Core: the shared App object, the list of sections, saving/loading -->
  <script src="js/app.js"></script>
  <script src="js/routes.js"></script>
  <script src="js/storage.js"></script>

  <!-- 2. Pages: one file per page -->
  <script src="js/pages/home.js"></script>

  <script src="js/pages/profile/profile.js"></script>
  <script src="js/pages/profile/profile-info.js"></script>
  <script src="js/pages/profile/settings.js"></script>
  <script src="js/pages/profile/notifications.js"></script>
  <script src="js/pages/profile/history.js"></script>

  <script src="js/pages/training/training.js"></script>
  <script src="js/pages/training/dance/dance.js"></script>
  <script src="js/pages/training/dance/videos.js"></script>
  <script src="js/pages/training/dance/warming-up.js"></script>
  <script src="js/pages/training/dance/youtube-player.js"></script>
  <script src="js/pages/training/dance/learn-choreo.js"></script>
  <script src="js/pages/training/dance/learn-choreo-player.js"></script>
  <script src="js/pages/training/dance/compare.js"></script>
  <script src="js/pages/training/vocals.js"></script>
  <script src="js/pages/training/rap.js"></script>
  <script src="js/pages/training/korean.js"></script>

  <script src="js/pages/schedule/schedule.js"></script>
  <script src="js/pages/schedule/calendar.js"></script>
  <script src="js/pages/schedule/day-board.js"></script>
  <script src="js/pages/goals.js"></script>

  <!-- 3. Router: starts the app (must stay last) -->
  <script src="js/router.js"></script>
</body>
</html>
